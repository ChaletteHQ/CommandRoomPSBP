<!doctype html>
<meta charset="utf-8">
<style>:root{color-scheme:dark;--paper:#16130F;--paper-lift:#211C16;--ink:#F0E8D8;--ink-soft:#C9C0AE;--gold:#C9A06A;--gold-soft:#2A2218;--rule:rgba(240,232,216,0.12);--rule-strong:rgba(240,232,216,0.32);--muted:#8C8475;--card:#211C16;--paper-2:#1A1612;--ink-2:#D6CCB7;--ink-3:#A89F8C;--line-2:#352F27;--gold-dim:#8C7148;--serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}body,html{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}.wrap{max-width:760px;padding:30px 30px 26px}.brand-head{text-align:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--rule)}.wordmark{font-family:var(--serif);font-weight:500;font-size:42px;letter-spacing:-0.5px;line-height:1;margin-bottom:12px}.wordmark .c-letter{color:var(--gold)}.wordmark .halette{color:var(--ink);font-size:38px}.cr-band{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}.cr-band .rule{flex:1;max-width:100px;height:1px;background:var(--rule-strong)}.cr-label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:3.5px;color:var(--ink);text-transform:uppercase}.artifact-title{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink);margin:18px 0 4px;line-height:1.15}.sub{color:var(--ink-2);font-size:13px;font-family:var(--sans)}.controls{display:flex;gap:10px;align-items:center;margin:0 0 22px;justify-content:center;flex-wrap:wrap}.ghost-btn{appearance:none;background:transparent;border:1px solid var(--line-2);color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:0.24em;text-transform:uppercase;padding:7px 12px;cursor:pointer;border-radius:3px;transition:color 200ms,border-color 200ms,background 200ms}.ghost-btn:hover{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}.timestamp{color:var(--muted);font-size:11.5px;font-family:var(--mono)}.tree{display:flex;flex-direction:column;gap:14px}.org{padding:12px 14px;background:var(--card);border:1px solid var(--rule);border-radius:4px}.org-head{display:flex;align-items:center;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}.org-name{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink);flex:1;cursor:pointer;transition:color 0.12s}.org-name:hover{color:var(--gold)}.org-meta{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;flex-shrink:0}.org-toggle{appearance:none;background:transparent;border:none;color:var(--gold-dim);font-size:11px;cursor:pointer;padding:0;font-family:var(--mono);transition:color 0.12s;flex-shrink:0;width:14px;text-align:center}.org-toggle:hover{color:var(--gold)}.org.collapsed .org-body,.subord.collapsed .org-body{display:none}.org.collapsed .org-head,.subord.collapsed .org-head{border-bottom:none;padding-bottom:0}.proj-list{display:flex;flex-direction:column;gap:1px;margin-top:8px}.proj{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:3px;cursor:pointer;transition:background 0.12s,color 0.12s;font-size:13.5px;color:var(--ink-2)}.proj:hover{background:var(--gold-soft);color:var(--gold)}.proj-name{flex:1;font-family:var(--sans)}.proj-stage{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.proj:hover .proj-stage{color:var(--gold-dim)}.children{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-left:12px;border-left:2px solid var(--rule-strong)}.subord{padding:10px 12px;background:var(--paper-2);border:1px solid var(--rule);border-radius:3px}.subord .org-name{font-size:15.5px}.subord .org-meta{font-size:9.5px}.stuck-line{margin-top:8px;padding:5px 10px;font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--gold-soft);border-radius:3px;cursor:pointer;transition:background 0.12s}.stuck-line:hover{background:rgba(201,160,106,0.18)}.stuck-line .stuck-tag{color:var(--gold-dim);letter-spacing:1px;text-transform:uppercase;font-size:9.5px;margin-right:6px}.tier-section{margin-top:22px;display:flex;flex-direction:column}.tier-body{display:flex;flex-direction:column;gap:12px;margin-top:10px}.tier-section.collapsed .tier-body{display:none}.tier-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;cursor:pointer;border-bottom:1px solid var(--rule)}.tier-head:hover .tier-label,.tier-head:hover .tier-toggle{color:var(--gold)}.tier-label{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-3);transition:color 0.12s}.tier-count{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:1px;margin-left:6px}.tier-toggle{font-family:var(--mono);font-size:10px;color:var(--gold-dim);letter-spacing:1px;transition:color 0.12s}.tier-section:not(.collapsed) .tier-toggle::before{content:"▾ "}.tier-section.collapsed .tier-toggle::before{content:"▸ "}.tier-primary .org{border-left:3px solid var(--gold)}.tier-secondary .org{border-left:2px solid var(--gold-dim)}.tier-external .org{background:var(--paper-2);border:1px solid var(--rule);border-left:2px dashed var(--gold-dim)}.tier-external .org-name{color:var(--ink-2)}.tier-passive .org{background:var(--paper-2);border:1px solid var(--rule);opacity:0.7}.tier-passive .org-name{color:var(--ink-3)}.tier-passive .org-head{border-bottom:none;padding-bottom:0}.empty{padding:14px;color:var(--muted);font-size:13px;background:var(--card);border:1px dashed var(--rule);border-radius:4px;font-family:var(--sans);text-align:center}.footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px;text-align:center;line-height:1.6;font-family:var(--sans)}.footer code{background:var(--paper-lift);padding:2px 7px;border-radius:3px;font-size:11.5px;font-family:var(--mono);color:var(--ink)}#cr-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--paper-lift);color:var(--ink);padding:11px 20px;border:1px solid rgba(201,160,106,0.45);border-radius:4px;font-size:13px;font-family:var(--mono);letter-spacing:0.5px;z-index:9999;opacity:0;transition:opacity 0.18s;box-shadow:0 6px 18px rgba(0,0,0,0.5);pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#cr-toast.show{opacity:1}</style>
<div class="wrap" data-artifact="orgs-map">
  <div class="brand-head">
    <div class="wordmark"><span class="c-letter">C</span><span class="halette">halette</span></div>
    <div class="cr-band"><div class="rule"></div><div class="cr-label">Command Room</div><div class="rule"></div></div>
    <div class="artifact-title">Workspace Map</div>
    <div class="sub">{{CEO_DISPLAY_NAME}} &middot; click any row to load it in chat</div>
  </div>

  <div class="controls">
    <button class="ghost-btn" id="refresh-btn" type="button">↻ Refresh</button>
    <span class="timestamp">Built {{LAST_BUILT}}</span>
  </div>

  <div class="tree" id="tree"></div>

  <div class="footer">
    Click an org or project to load it. Stuck people show inline only when something needs attention.
  </div>
</div>
<div id="cr-toast"></div>
<script>
const $=document.getElementById.bind(document);
const $c=document.createElement.bind(document);
function aE(e,t,f,o){return e.addEventListener(t,f,o);}
const ORGS={{ORGS_JSON}};
const PROJECTS={{PROJECTS_JSON}};
const PEOPLE={{PEOPLE_JSON}};
const PEOPLE_BY_ORG={};
(function indexPeople(){if(!PEOPLE)return;PEOPLE.forEach(p=>{const oid=p.org||'';if(!oid)return;(PEOPLE_BY_ORG[oid]=PEOPLE_BY_ORG[oid]||[]).push(p);});})();
function flashToast(msg){const t=$('cr-toast');if(!t) return;t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200);}
function tryExecCopy(text){try{const ta=$c('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:absolute;left:-9999px;top:0;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);const ok=document.execCommand('copy');ta.remove();return !!ok;}catch(e){return false;}}
function send(prompt){if(window.cowork&&typeof window.cowork.sendPrompt==='function'){try{window.cowork.sendPrompt(prompt);flashToast('Sent to chat');return;}catch(e){}}if(typeof window.sendPrompt==='function'){try{window.sendPrompt(prompt);flashToast('Sent to chat');return;}catch(e){}}if(tryExecCopy(prompt)){flashToast('Copied — paste in chat');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(prompt).then(()=>flashToast('Copied — paste in chat'));}}
function esc(s){return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function projsForOrg(orgId){return (PROJECTS||[]).filter(p=>p.org===orgId||p.org_id===orgId);}
function orgName(o){return o.name||o.canonical_name||o.id;}
function stuckPersonFor(orgId){const ppl=PEOPLE_BY_ORG[orgId];if(!ppl||ppl.length===0)return null;return ppl.find(p=>p.tone==='stuck')||null;}
function renderProjList(orgId){const projs=projsForOrg(orgId);if(projs.length===0)return null;const list=$c('div');list.className='proj-list';projs.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).forEach(p=>{const projEl=$c('div');projEl.className='proj';const pName=p.name||p.id;const stage=(p.stage||p.status||'').toLowerCase();projEl.innerHTML='<div class="proj-name">▸ '+esc(pName)+'</div>'+(stage?'<div class="proj-stage">'+esc(stage)+'</div>':'');aE(projEl,'click',()=>send('go '+pName));list.appendChild(projEl);});return list;}
function renderStuckLine(orgId){const p=stuckPersonFor(orgId);if(!p)return null;const name=p.name||p.id||'';if(!name)return null;const row=$c('div');row.className='stuck-line';row.innerHTML='<span class="stuck-tag">overdue</span>'+esc(name);aE(row,'click',()=>send('go '+name));return row;}
function renderOrg(o,depth){const orgEl=$c('div');orgEl.className=depth===0?'org':'subord';const name=orgName(o);const projs=projsForOrg(o.id);orgEl.innerHTML='<div class="org-head"><button class="org-toggle" type="button" aria-label="toggle">▾</button><div class="org-name">'+esc(name)+'</div><div class="org-meta">'+projs.length+' project'+(projs.length===1?'':'s')+'</div></div>';const nameEl=orgEl.querySelector('.org-name');const toggleEl=orgEl.querySelector('.org-toggle');aE(nameEl,'click',(e)=>{e.stopPropagation();send('go '+name);});aE(toggleEl,'click',(e)=>{e.stopPropagation();const isCollapsed=orgEl.classList.toggle('collapsed');toggleEl.textContent=isCollapsed?'▸':'▾';});const bodyWrap=$c('div');bodyWrap.className='org-body';const projList=renderProjList(o.id);if(projList)bodyWrap.appendChild(projList);const stuck=renderStuckLine(o.id);if(stuck)bodyWrap.appendChild(stuck);if(o.children&&o.children.length>0){const childWrap=$c('div');childWrap.className='children';o.children.forEach(c=>childWrap.appendChild(renderOrg(c,depth+1)));bodyWrap.appendChild(childWrap);}orgEl.appendChild(bodyWrap);return orgEl;}
function tierOf(o){return o.tier||'secondary';}
function renderTierSection(label,tier,orgs,collapsedDefault){if(!orgs||orgs.length===0)return null;const sec=$c('div');sec.className='tier-section tier-'+tier+(collapsedDefault?' collapsed':'');const head=$c('div');head.className='tier-head';head.innerHTML='<div><span class="tier-label">'+esc(label)+'</span><span class="tier-count">('+orgs.length+')</span></div><div class="tier-toggle">'+(collapsedDefault?'show':'hide')+'</div>';sec.appendChild(head);const body=$c('div');body.className='tier-body';orgs.sort((a,b)=>orgName(a).localeCompare(orgName(b))).forEach(o=>body.appendChild(renderOrg(o,0)));sec.appendChild(body);aE(head,'click',()=>{const isCollapsed=sec.classList.toggle('collapsed');const t=sec.querySelector('.tier-toggle');if(t)t.textContent=isCollapsed?'show':'hide';});return sec;}
function render(){const root=$('tree');root.innerHTML='';if(!ORGS||ORGS.length===0){root.innerHTML='<div class="empty">No orgs in entities.json yet. Run <code>set up command room</code> or <code>ingest folder [path]</code> to seed your workspace.</div>';return;}const byTier={primary:[],secondary:[],external:[],passive:[]};ORGS.forEach(o=>{const t=tierOf(o);(byTier[t]||byTier.secondary).push(o);});const primarySec=renderTierSection('Your orgs','primary',byTier.primary,false);if(primarySec)root.appendChild(primarySec);const secSec=renderTierSection('Active engagements','secondary',byTier.secondary,false);if(secSec)root.appendChild(secSec);const extSec=renderTierSection('External','external',byTier.external,true);if(extSec)root.appendChild(extSec);const passSec=renderTierSection('Archive','passive',byTier.passive,true);if(passSec)root.appendChild(passSec);}
aE($('refresh-btn'),'click',()=>send('rebuild workspace map'));
render();
</script>
