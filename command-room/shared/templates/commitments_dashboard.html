<!doctype html>
<meta charset="utf-8">
<title>My Open Commitments</title>
<style>
:root{color-scheme:dark;--paper:#16130F;--paper-2:#1A1612;--card:#211C16;--ink:#F0E8D8;--ink-2:#D6CCB7;--ink-3:#A89F8C;--muted:#8C8475;--gold:#C9A06A;--gold-dim:#8C7148;--gold-soft:#2A2218;--rule:rgba(240,232,216,0.12);--rule-strong:rgba(240,232,216,0.32);--line-2:#352F27;--red:#C97A6A;--red-soft:#2B1C18;--serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
.wrap{max-width:820px;padding:30px 30px 26px}
.brand-head{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.wordmark{font-family:var(--serif);font-weight:500;font-size:42px;letter-spacing:-0.5px;line-height:1;margin-bottom:12px}
.wordmark .c-letter{color:var(--gold)}.wordmark .halette{color:var(--ink);font-size:38px}
.cr-band{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.cr-band .rule{flex:1;max-width:100px;height:1px;background:var(--rule-strong)}
.cr-label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:3.5px;color:var(--ink);text-transform:uppercase}
.artifact-title{font-family:var(--serif);font-size:30px;font-weight:500;margin:18px 0 4px;line-height:1.15}
.sub{color:var(--ink-2);font-size:13px}
.scope-note{margin:14px 0 18px;padding:9px 13px;background:var(--paper-2);border:1px solid var(--rule);border-left:2px solid var(--gold-dim);border-radius:3px;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.scope-note b{color:var(--ink-2);font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{flex:1;min-width:104px;padding:11px 13px;background:var(--card);border:1px solid var(--rule);border-radius:4px}
.stat.alert{border-left:2px solid var(--red)}
.stat.warn{border-left:2px solid var(--gold)}
.stat-num{font-family:var(--serif);font-size:27px;line-height:1;color:var(--ink)}
.stat.alert .stat-num{color:var(--red)}.stat.warn .stat-num{color:var(--gold)}
.stat-lab{font-family:var(--mono);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-top:6px}
.controls{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.controls .spacer{flex:1}
.ghost-btn{appearance:none;background:transparent;border:1px solid var(--line-2);color:var(--ink-3);font-family:var(--mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;padding:7px 11px;cursor:pointer;border-radius:3px;transition:color .2s,border-color .2s,background .2s}
.ghost-btn:hover{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.ghost-btn.on{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
.timestamp{color:var(--muted);font-size:11px;font-family:var(--mono)}
.seg{display:flex;gap:0;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg .ghost-btn{border:none;border-radius:0}
.seg .ghost-btn+.ghost-btn{border-left:1px solid var(--line-2)}
.groups{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.grp{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--gold-dim);border-radius:4px;padding:11px 13px}
.grp.has-overdue{border-left-color:var(--red)}
.grp-head{display:flex;align-items:center;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--rule);cursor:pointer}
.grp.collapsed .grp-head{border-bottom:none;padding-bottom:0}
.grp.collapsed .grp-body{display:none}
.grp-toggle{font-family:var(--mono);font-size:11px;color:var(--gold-dim);width:12px;flex-shrink:0}
.grp-name{font-family:var(--serif);font-size:18px;flex:1;color:var(--ink)}
.grp-name span.sub-org{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-left:8px}
.grp-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.grp-meta .od{color:var(--red)}
.grp-body{display:flex;flex-direction:column;gap:1px;margin-top:7px}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:3px;cursor:pointer;transition:background .12s}
.row:hover{background:var(--gold-soft)}
.row-main{flex:1;min-width:0}
.row-title{font-size:13.5px;color:var(--ink-2);line-height:1.4}
.row:hover .row-title{color:var(--gold)}
.row-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px;margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.row-sub .who{color:var(--gold-dim)}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;padding:2px 6px;border-radius:2px;flex-shrink:0;margin-top:2px}
.tag.od{background:var(--red-soft);color:var(--red);border:1px solid rgba(201,122,106,.4)}
.tag.st{background:var(--gold-soft);color:var(--gold);border:1px solid rgba(201,160,106,.35)}
.empty{padding:16px;color:var(--muted);font-size:13px;background:var(--card);border:1px dashed var(--rule);border-radius:4px;text-align:center}
.footer{margin-top:24px;padding-top:15px;border-top:1px solid var(--rule);color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
.footer code{background:var(--paper-2);padding:2px 7px;border-radius:3px;font-size:11px;font-family:var(--mono);color:var(--ink-2)}
.act-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
#cr-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--paper-2);color:var(--ink);padding:11px 20px;border:1px solid rgba(201,160,106,.45);border-radius:4px;font-size:13px;font-family:var(--mono);z-index:9999;opacity:0;transition:opacity .18s;box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cr-toast.show{opacity:1}
</style>
<div class="wrap" data-artifact="my-commitments">
  <div class="brand-head">
    <div class="wordmark"><span class="c-letter">C</span><span class="halette">halette</span></div>
    <div class="cr-band"><div class="rule"></div><div class="cr-label">Command Room</div><div class="rule"></div></div>
    <div class="artifact-title">My Open Commitments</div>
    <div class="sub">{{USER}} &middot; what you owe, by person and org</div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="scope-note" id="scope"></div>

  <div class="controls">
    <div class="seg">
      <button class="ghost-btn on" data-group="org" type="button">By org</button>
      <button class="ghost-btn" data-group="person" type="button">By person</button>
    </div>
    <div class="seg">
      <button class="ghost-btn on" data-filter="all" type="button">All</button>
      <button class="ghost-btn" data-filter="overdue" type="button">Overdue</button>
      <button class="ghost-btn" data-filter="resting" type="button">Resting</button>
      <button class="ghost-btn" data-filter="dated" type="button">Dated</button>
    </div>
    <div class="spacer"></div>
    <span class="timestamp">Built {{BUILT}}</span>
  </div>

  <div class="groups" id="groups"></div>

  <div class="footer">
    <div class="act-row" style="margin-top:14px">
      <button class="ghost-btn" id="act-triage" type="button">Triage my commitments</button>
      <button class="ghost-btn" id="act-queue" type="button">Needs your call</button>
      <button class="ghost-btn" id="act-refresh" type="button">↻ Rebuild</button>
    </div>
    Read-only view — the same rows, blocks and reasons as <code>what's on my plate</code>. Click a row to load its thread in chat; say <code>what's on my plate</code> to close, defer, or drop them.
  </div>
</div>
<div id="cr-toast"></div>
<script>
const DATA={{DATA_JSON}};
const $=document.getElementById.bind(document);
const $c=document.createElement.bind(document);
function aE(e,t,f){return e.addEventListener(t,f);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function flashToast(m){const t=$('cr-toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function tryExecCopy(text){try{const ta=$c('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:absolute;left:-9999px;top:0;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);const ok=document.execCommand('copy');ta.remove();return !!ok;}catch(e){return false;}}
function send(p){if(window.cowork&&typeof window.cowork.sendPrompt==='function'){try{window.cowork.sendPrompt(p);flashToast('Sent to chat');return;}catch(e){}}if(typeof window.sendPrompt==='function'){try{window.sendPrompt(p);flashToast('Sent to chat');return;}catch(e){}}if(tryExecCopy(p)){flashToast('Copied — paste in chat');return;}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p).then(()=>flashToast('Copied — paste in chat'));}}

let groupMode='org', filterMode='all';
const COLLAPSED={};

function renderStats(){
  const h=(DATA.counts&&DATA.counts.headline)||{};
  const rows=DATA.rows||[];
  const od=rows.filter(r=>r.overdue).length, st=rows.filter(r=>r.block==='parked').length;
  const cards=[
    {n:rows.length,l:'You owe',c:''},
    {n:od,l:'Overdue',c:od?'alert':''},
    {n:st,l:'Resting',c:st?'warn':''},
    {n:rows.filter(r=>!r.due).length,l:'No due date',c:''},
    {n:h.owed_to_you==null?'—':h.owed_to_you,l:'Owed to you',c:''}
  ];
  $('stats').innerHTML=cards.map(c=>'<div class="stat '+c.c+'"><div class="stat-num">'+c.n+'</div><div class="stat-lab">'+c.l+'</div></div>').join('');
}

function renderScope(){
  const h=(DATA.counts&&DATA.counts.headline)||{};
  const t=(DATA.counts&&DATA.counts.total)||0;
  $('scope').innerHTML='Scope: <b>what you owe</b> — '+(DATA.rows||[]).length+' of '+t+
    ' open items, grouped the way your plate groups them. Not shown here: '+(h.owed_to_you||0)+
    ' owed to you, '+(h.unowned||0)+' with no clear owner, and '+(h.unconfirmed||0)+
    ' guesses from your calls waiting for a yes or no — say <code>needs your call</code> for those.';
}

function passes(r){
  if(filterMode==='overdue')return !!r.overdue;
  if(filterMode==='resting')return r.block==='parked';
  if(filterMode==='dated')return !!r.due;
  return true;
}

function keyFor(r){
  if(groupMode==='person')return r.cp_name||'No named counterparty';
  return r.bucket||'Unassigned';
}

function subLabel(r){
  const bits=[];
  if(groupMode==='person'){ if(r.bucket&&r.bucket!=='Unassigned')bits.push(r.bucket); }
  else if(r.cp_name){ bits.push('<span class="who">'+esc(r.cp_name)+'</span>'); }
  if(r.thread_name&&r.thread_name!==r.bucket)bits.push(esc(r.thread_name));
  bits.push(r.due?('due '+esc(r.due)):(r.age_days!=null?(r.age_days+'d old'):'undated'));
  if(r.reason)bits.push(esc(r.reason));
  else if(r.quiet_days!=null)bits.push('quiet '+r.quiet_days+'d');
  if(r.kind&&r.kind!=='promise')bits.push(esc(r.kind));
  return bits.join('<span style="color:var(--line-2)">·</span>');
}

function render(){
  renderStats();renderScope();
  const root=$('groups');root.innerHTML='';
  const rows=(DATA.rows||[]).filter(passes);
  if(rows.length===0){root.innerHTML='<div class="empty">Nothing matches this filter. Try <b>All</b>, or run <code>triage my commitments</code>.</div>';return;}
  const map={};
  rows.forEach(r=>{const k=keyFor(r);(map[k]=map[k]||[]).push(r);});
  const keys=Object.keys(map).sort((a,b)=>{
    const ao=map[a].filter(r=>r.overdue).length,bo=map[b].filter(r=>r.overdue).length;
    if(ao!==bo)return bo-ao;
    if(map[b].length!==map[a].length)return map[b].length-map[a].length;
    return a.localeCompare(b);
  });
  keys.forEach(k=>{
    const items=map[k];
    const od=items.filter(r=>r.overdue).length;
    const g=$c('div');
    g.className='grp'+(od?' has-overdue':'')+(COLLAPSED[k]?' collapsed':'');
    const orgHint=(groupMode==='person'&&items[0].bucket&&items[0].bucket!=='Unassigned')?'<span class="sub-org">'+esc(items[0].bucket)+'</span>':'';
    g.innerHTML='<div class="grp-head"><div class="grp-toggle">'+(COLLAPSED[k]?'▸':'▾')+'</div>'+
      '<div class="grp-name">'+esc(k)+orgHint+'</div>'+
      '<div class="grp-meta">'+items.length+' open'+(od?' · <span class="od">'+od+' overdue</span>':'')+'</div></div>';
    const body=$c('div');body.className='grp-body';
    items.forEach(r=>{
      const row=$c('div');row.className='row';
      row.innerHTML='<div class="row-main"><div class="row-title">'+esc(r.title)+'</div>'+
        '<div class="row-sub">'+subLabel(r)+'</div></div>'+
        (r.overdue?'<div class="tag od">overdue</div>':'')+
        (r.block&&r.block!=='do_it'&&r.block_label?'<div class="tag st">'+esc(r.block_label.toLowerCase())+'</div>':'');
      aE(row,'click',e=>{e.stopPropagation();
        const target=r.thread_name||r.bucket;
        if(target&&target!=='Unassigned')send('go '+target);
        else if(r.cp_name)send('who is '+r.cp_name);
        else send('triage my commitments');
      });
      body.appendChild(row);
    });
    g.appendChild(body);
    aE(g.querySelector('.grp-head'),'click',()=>{COLLAPSED[k]=!COLLAPSED[k];render();});
    root.appendChild(g);
  });
}

document.querySelectorAll('[data-group]').forEach(b=>aE(b,'click',()=>{
  groupMode=b.dataset.group;
  document.querySelectorAll('[data-group]').forEach(x=>x.classList.toggle('on',x===b));
  Object.keys(COLLAPSED).forEach(k=>delete COLLAPSED[k]);
  render();
}));
document.querySelectorAll('[data-filter]').forEach(b=>aE(b,'click',()=>{
  filterMode=b.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));
  render();
}));
aE($('act-triage'),'click',()=>send('triage my commitments'));
aE($('act-queue'),'click',()=>send('needs your call'));
aE($('act-refresh'),'click',()=>send('rebuild my commitments dashboard'));
render();
</script>
