<!--
  Infographic layout: ranked_list (SPEC OUT4). Scored rows + optional stat
  band. Structure-only fragment; every color/font is a CSS variable resolved
  by the OUT5 premium shell (shared/templates/premium_brief.html) from
  brand.get_brand(). NO literal hex here (stray-palette guard). Rendered ONLY
  by shared/scripts/infographic.py build_infographic("ranked_list", ...).
  Slots: {{TILEBAND}} (may be empty), {{ROWS}}.
-->
<style>
  .ig-ranked-rows{list-style:none;padding:0;margin:16px 0 0}
  .ig-ranked-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:3px;margin-bottom:8px;background:rgba(244,240,232,.02)}
  .ig-ranked-row .rk{font:600 13px/1 var(--mono);color:var(--accent);min-width:24px}
  .ig-ranked-row .lbl{font:600 14px/1.35 var(--serif);color:var(--fg);flex:1}
  .ig-ranked-row .score{font:600 15px/1 var(--serif);color:var(--accent-soft);white-space:nowrap}
  .ig-ranked-row .note{flex-basis:100%;font:400 11.5px/1.55 var(--sans);color:var(--fg-3);margin:2px 0 0 38px}
</style>
<section class="ig ig-ranked">
{{TILEBAND}}
<ol class="ig-ranked-rows">{{ROWS}}</ol>
</section>
