<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | Command Room</title>
<meta name="robots" content="noindex">
<!--
  Command Room — Premium Brief template (SPEC OUT5; generalized from the
  research skill's research_brief.html, which this template SUPERSEDES).
  Self-contained, dark, brand-resolved: every accent color and font family is
  a template variable filled from brand.get_brand() by
  shared/scripts/premium_html.py make_premium_brief() — the ONLY renderer of
  this file. No hand token-fill (the #104 / field-report-2026-07-16 class:
  prose-instructed renders get skipped; a mechanical call does not).

  SELF-CONTAINED FENCE (SPEC OUT5 §4): no external fonts, no CDN, no asset
  server, no CSS import of any remote stylesheet. Font stacks lead with the
  brand font and fall back to system faces. Everything renders offline,
  anywhere, byte-for-byte.

  RENDERING CONTRACT: do not fill these tokens by hand. Call
  premium_html.make_premium_brief(...) — it runs the same gate stack as
  brief_writer.make_brief (contract -> voice -> exec-header -> render -> leak
  scan; parity pinned by tests/run_guard_g16_gate_parity_test.py) and asserts
  the file lands on disk.

  CHART SLOT (SPEC OUT3 coordination): the `.chart-slot` region below is
  DORMANT — it renders only when a section carries an OUT3 charts.py SVG.
  Leave it dormant until OUT3 merges; do not hand-compose chart markup.
-->
<style>
  :root{
    --bg:#0D0B0A; --surface:#1E1A17; --surface-2:#19150F; --elevated:#2A2420;
    --fg:#F4F0E8; --fg-2:#D9D2C3; --fg-3:#A89F93; --muted:#7A7268;
    --line:#3A322C; --line-soft:#2A2420;
    --accent:#{{ACCENT}}; --accent-soft:#{{ACCENT_SOFT}};
    --teal:#5BB89E; --slate:#9DB4CE; --forest:#7FB890; --gold:#D6A664; --carmine:#E08585;
    --serif:{{SERIF_STACK}};
    --sans:{{SANS_STACK}};
    --mono:{{MONO_STACK}};
    --body-leading:{{BODY_LEADING}};
    --body-space:{{BODY_SPACE}};
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg-2);font-family:var(--sans);margin:0;min-height:100vh;
    display:flex;flex-direction:column;
    background-image:radial-gradient(1100px 520px at 50% -8%, {{ACCENT_GLOW}}, transparent 70%);
    background-attachment:fixed;
  }
  ::selection{background:{{ACCENT_SELECTION}};color:#fff}

  /* chrome bar */
  .bar{background:rgba(13,11,10,.82);backdrop-filter:saturate(140%) blur(8px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line-soft)}
  .bar-in{max-width:940px;margin:0 auto;padding:14px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{height:26px;width:26px;display:block;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 2px 10px -4px rgba(0,0,0,.6)}
  .brand .wordmark{font:500 11px/1.1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--fg-3)}
  .bar-meta{font:600 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}

  /* page + document */
  .page{flex:1;width:100%;max-width:940px;margin:0 auto;padding:clamp(26px,4vw,64px) clamp(16px,3vw,32px) 64px}
  .doc{
    position:relative;background:linear-gradient(168deg,var(--surface) 0%,var(--surface-2) 100%);
    border:1px solid var(--line);border-radius:3px;
    box-shadow:0 1px 0 rgba(244,240,232,.03) inset,0 30px 80px -40px rgba(0,0,0,.9);
    padding:clamp(30px,5vw,64px) clamp(26px,6vw,80px);max-width:800px;margin:0 auto;overflow:hidden;
  }
  .doc::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 22%,var(--accent-soft) 50%,var(--accent) 78%,transparent)}

  .eyebrow{font:600 9.5px/1.2 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
  .title{font:600 clamp(30px,4.6vw,42px)/1.08 var(--serif);letter-spacing:.002em;color:var(--fg);margin:0 0 8px;max-width:22ch;text-wrap:balance}
  .subtitle{font:400 12.5px/1.5 var(--sans);color:var(--fg-3);margin:0 0 16px;letter-spacing:.01em}

  /* badges */
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .chip{font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:6px}
  .chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
  .chip.enriched{color:var(--teal);background:rgba(91,184,158,.10);border-color:rgba(91,184,158,.34)}
  .chip.tavily{color:var(--slate);background:rgba(157,180,206,.10);border-color:rgba(157,180,206,.32)}
  .chip.web{color:var(--fg-3);background:rgba(244,240,232,.04);border-color:var(--line)}
  .chip.high{color:var(--forest);background:rgba(127,184,144,.10);border-color:rgba(127,184,144,.32)}
  .chip.medium{color:var(--gold);background:rgba(214,166,100,.10);border-color:rgba(214,166,100,.32)}
  .chip.low{color:var(--carmine);background:rgba(224,133,133,.10);border-color:rgba(224,133,133,.32)}

  hr.rule{border:0;height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:14px 0 24px}

  /* exec header — the 30-second contract (EXEC1 element 1) */
  .bottomline{
    font:500 17px/1.5 var(--serif);color:var(--fg);
    background:linear-gradient(90deg,{{ACCENT_WASH}},{{ACCENT_WASH_FAINT}});
    border-left:2px solid var(--accent);padding:16px 20px;margin:0 0 14px;border-radius:0 3px 3px 0;
  }
  .exec-lines{margin:0 0 12px}
  .exec-line{display:flex;gap:12px;align-items:baseline;font:400 12.5px/1.55 var(--sans);color:var(--fg-2);margin:0 0 4px}
  .exec-label{font:600 9px/1.6 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);min-width:64px}

  /* sections */
  .section{margin:0 0 24px}
  .section h2{font:600 12px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:20px 0 10px;display:flex;align-items:center;gap:9px}
  .section h2::before{content:"";width:14px;height:1px;background:var(--accent);opacity:.6}
  .section h3{font:600 13px/1.3 var(--sans);color:var(--fg);margin:12px 0 4px}
  .section p{font:400 12.5px/var(--body-leading) var(--sans);color:var(--fg-2);margin:0 0 var(--body-space);max-width:72ch}
  .section ul,.section ol{margin:0 0 10px;padding-left:20px;font:400 12.5px/1.6 var(--sans);color:var(--fg-2)}
  .section li{margin-bottom:7px}
  .section li::marker{color:var(--accent)}
  .section li strong{color:var(--fg);font-weight:600}
  .cite{font:500 10px/1 var(--mono);color:var(--accent);text-decoration:none;border-bottom:1px dotted {{ACCENT_DOTTED}};margin-left:5px;white-space:nowrap}
  .cite:hover{color:var(--accent-soft);border-bottom-color:var(--accent-soft)}
  .flag-low{color:var(--carmine);font-style:italic}

  /* stat tiles — components.build_tile_band_html markup, dark-composed */
  .cr-counter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0 14px}
  .cr-counter-card{background:rgba(244,240,232,.03);border:1px solid var(--line);border-radius:3px;padding:14px 16px;text-align:center}
  .cr-counter-label{font:600 8.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);order:2}
  .cr-counter-value{font:600 22px/1.2 var(--serif);color:var(--fg);margin-bottom:4px}

  /* tables + matrix — components.build_table_html / build_matrix_html markup */
  .cr-table{border-collapse:collapse;width:100%;margin:10px 0 14px;font:400 12px/1.5 var(--sans);color:var(--fg-2)}
  .cr-table-th{text-align:left;font:600 9.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:8px 10px;border-bottom:1px solid var(--line)}
  .cr-table-td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .cr-table-row:nth-child(even) .cr-table-td{background:rgba(244,240,232,.018)}
  .cr-row-hl .cr-table-td{background:{{ACCENT_WASH}} !important;color:var(--fg);font-weight:500}
  .cr-matrix-rowhead{text-align:left;font:600 11.5px/1.4 var(--sans);color:var(--fg);padding:8px 10px;border-bottom:1px solid var(--line-soft);background:rgba(244,240,232,.03)}
  .cr-flag-ok{color:var(--forest);background:rgba(127,184,144,.08)}
  .cr-flag-warn{color:var(--gold);background:rgba(214,166,100,.08)}
  .cr-flag-bad{color:var(--carmine);background:rgba(224,133,133,.08)}

  /* relationship timeline — components.build_timeline_html markup */
  .cr-timeline{list-style:none;padding:0;margin:6px 0 12px}
  .cr-timeline li{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line-soft);font:400 12.5px/1.5 var(--sans);color:var(--fg-3)}
  .cr-timeline li:last-child{border-bottom:0}
  .cr-timeline-when{font:600 9.5px/1.6 var(--mono);letter-spacing:.06em;color:var(--accent);white-space:nowrap;min-width:82px;text-transform:uppercase}
  .cr-timeline-current{color:var(--fg);font-weight:600}

  /* decision makers (research: who-&-what-matters) */
  .people{display:grid;gap:11px;margin:6px 0}
  .person{border:1px solid var(--line);border-radius:3px;padding:14px 16px;background:rgba(244,240,232,.018)}
  .person .name{font:600 14px/1.3 var(--serif);color:var(--fg);letter-spacing:.01em}
  .person .role{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-left:8px}
  .person.buyer{border-color:{{ACCENT_BORDER}};background:linear-gradient(90deg,{{ACCENT_WASH_LIGHT}},transparent);box-shadow:inset 3px 0 0 var(--accent)}
  .person .tag{font:600 8px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--accent);border-radius:999px;padding:4px 8px;margin-left:9px;vertical-align:middle}
  .person .note{font:400 11.5px/1.55 var(--sans);color:var(--fg-2);margin:7px 0 0}

  /* recent signals — timeline (research) */
  .events{list-style:none;padding:0;margin:6px 0}
  .events li{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft);font:400 12.5px/1.5 var(--sans);color:var(--fg-2)}
  .events li:last-child{border-bottom:0}
  .events .when{font:600 9.5px/1.6 var(--mono);letter-spacing:.06em;color:var(--accent);white-space:nowrap;min-width:82px;text-transform:uppercase}

  /* chart slot (SPEC OUT3 — dormant until charts.py lands) */
  .chart-slot{margin:10px 0 14px}
  .chart-slot svg{max-width:100%;height:auto;display:block}

  /* the ASK block (EXEC1 element 4) */
  .asks{border:1px solid var(--line);border-radius:3px;padding:16px 20px;margin:6px 0 10px;background:rgba(244,240,232,.02)}
  .asks ul{margin:0;padding-left:20px}
  .asks li{margin-bottom:7px;font:400 12.5px/1.6 var(--sans);color:var(--fg-2)}
  .asks li::marker{color:var(--accent)}
  .ask-deadline{color:var(--fg-3);font-style:italic}

  /* footer */
  hr.rule--quiet{height:1px;background:var(--line-soft);margin:28px 0 18px}
  .foot-line{font:400 11px/1.55 var(--sans);color:var(--fg-3);margin:0 0 5px;display:flex;flex-wrap:wrap;gap:7px;align-items:baseline}
  .foot-label{color:var(--fg);font-weight:600;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .foot-sep{color:var(--line)}
  .foot-src{font-style:italic;color:var(--fg-3)}

  .page-foot{border-top:1px solid var(--line-soft);padding:20px clamp(16px,3vw,32px)}
  .page-foot-in{max-width:940px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
  .firm{font:500 10px/1.4 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

  @media(max-width:720px){.doc{padding:30px 22px}.title{font-size:28px}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <svg viewBox="0 0 72 72" fill="none" aria-hidden="true"><circle cx="36" cy="36" r="36" fill="#141110"></circle><text x="36" y="50" font-family="{{SERIF_SVG}}" font-weight="600" font-size="46" text-anchor="middle" fill="#{{ACCENT}}">{{MONOGRAM}}</text></svg>
      <span class="wordmark">{{WORDMARK}}</span>
    </div>
    <div class="bar-meta">{{KIND_LABEL}}</div>
  </div>
</header>

<main class="page">
  <article class="doc">

    <p class="eyebrow">{{KIND_LABEL}}</p>
    <h1 class="title">{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>

{{BADGES}}
{{EXEC_HEADER}}
{{CONTENT}}
{{ASKS}}

    <hr class="rule rule--quiet">
    <footer>
      <p class="foot-line">
        <span class="foot-label">Drafted by your AI Chief of Staff</span>
        <span class="foot-sep">&middot;</span>
        <span class="foot-src">{{SOURCE_SUMMARY}}</span>
      </p>
      <p class="foot-line" style="font-style:italic;color:var(--muted)">Saved to your workspace.</p>
    </footer>

  </article>
</main>

<footer class="page-foot">
  <div class="page-foot-in">
    <span class="firm">{{FOOTER_LINE}}</span>
  </div>
</footer>

</body>
</html>
