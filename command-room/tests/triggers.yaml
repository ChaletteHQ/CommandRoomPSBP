# =========================================================
# NEGATIVE TESTS — must NOT mis-fire
# =========================================================
# These phrases contain words that look close to a trigger
# but should be caught by negative triggers or routing rules.

- phrase: "prep me for my 2pm"
  expected: call-prep
  notes: "generic meeting prep → call-prep, NOT people-crm even though 'prep me for' is ambiguous"

- phrase: "hire a new head of ops"
  expected: workspace-manager
  notes: "'hire' is out-of-scope for team-intelligence — should fall to workspace-manager"

- phrase: "decision memo on the pricing change"
  expected: decision-memo-composer
  notes: "v3.8.0+ owns the 'decision memo on [topic]' trigger. Pre-v3.8.0 this routed to workspace-manager as a placeholder lifecycle command."

- phrase: "what's going on"
  expected: workspace-manager
  notes: "full daily briefing — must NOT fire list-active even though 'what' + 'projects' adjacent"

- phrase: "lets work"
  expected: workspace-manager
