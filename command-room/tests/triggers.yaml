# Trigger Collision Test Suite
#
# Purpose: Verify that real CEO phrases fire exactly one skill.
# Fail conditions:
#   - Zero skills match a phrase (missing trigger)
#   - Two or more skills match a phrase (collision)
#
# Add a new entry whenever a real user phrase uncovers a gap.
# Format:
#   - phrase: "what the user actually says"
#     expected: skill-folder-name
#     notes: optional context

